<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self';">
    <title>EBIOS Risk Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js" integrity="sha256-xoh0y6ov0WULfXcLMoaA6nZfszdgI8w2CEJ/3k8NBIE=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="./EBIOS-RM-Pro-v5.css" media="all" />
  </head>
  <body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar bg-slate-900 border-r border-slate-700 flex flex-col h-screen sticky top-0">
      <div class="p-3 border-b border-slate-700 flex items-center gap-2">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-lg shrink-0">🛡️</div>
        <div class="stxt">
          <h1 class="text-sm font-bold text-white">EBIOS RM Pro</h1>
          <p class="text-slate-500 text-xs">v5.0 • ANSSI</p>
        </div>
      </div>
      <nav class="flex-1 p-2 overflow-y-auto">
        <div class="stxt text-slate-500 text-[10px] uppercase tracking-wider px-2 py-1">Ateliers</div>
        <button onclick="goW(1)" class="wnav w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800" data-w="1">
          <span class="w-7 h-7 rounded bg-blue-600 flex items-center justify-center font-bold text-xs text-white shrink-0">1</span>
          <span class="stxt text-sm">Cadrage</span>
        </button>
        <button onclick="goW(2)" class="wnav w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800" data-w="2">
          <span class="w-7 h-7 rounded bg-red-600 flex items-center justify-center font-bold text-xs text-white shrink-0">2</span>
          <span class="stxt text-sm">Sources Risque</span>
        </button>
        <button onclick="goW(3)" class="wnav w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800" data-w="3">
          <span class="w-7 h-7 rounded bg-purple-600 flex items-center justify-center font-bold text-xs text-white shrink-0">3</span>
          <span class="stxt text-sm">Stratégiques</span>
        </button>
        <button onclick="goW(4)" class="wnav w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800" data-w="4">
          <span class="w-7 h-7 rounded bg-orange-600 flex items-center justify-center font-bold text-xs text-white shrink-0">4</span>
          <span class="stxt text-sm">Opérationnels</span>
        </button>
        <button onclick="goW(5)" class="wnav w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800" data-w="5">
          <span class="w-7 h-7 rounded bg-green-600 flex items-center justify-center font-bold text-xs text-white shrink-0">5</span>
          <span class="stxt text-sm">Traitement</span>
        </button>
        <div class="stxt text-slate-500 text-[10px] uppercase tracking-wider px-2 py-1 mt-3">Synthèse</div>
        <button onclick="goW(6)" class="wnav w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800" data-w="6">
          <span class="w-7 h-7 rounded bg-cyan-600 flex items-center justify-center text-xs shrink-0">📊</span>
          <span class="stxt text-sm">Dashboard</span>
        </button>
        <div class="stxt text-slate-500 text-[10px] uppercase tracking-wider px-2 py-1 mt-3">Ressources</div>
        <button onclick="showMitre()" class="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800">
          <span class="w-7 h-7 rounded bg-rose-700 flex items-center justify-center text-xs shrink-0">⚔️</span>
          <span class="stxt text-sm">MITRE ATT&CK</span>
        </button>
        <button onclick="showBDC()" class="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left mb-0.5 text-slate-400 hover:bg-slate-800">
          <span class="w-7 h-7 rounded bg-indigo-600 flex items-center justify-center text-xs shrink-0">📚</span>
          <span class="stxt text-sm">Base ANSSI</span>
        </button>
      </nav>
      <div class="p-2 border-t border-slate-700">
        <div class="stxt text-[10px] text-slate-500 mb-1 px-1">Projet: <span class="text-white" id="projName">-</span>
        </div>
        <div class="flex gap-1">
          <button onclick="expJSON()" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">💾</button>
          <button onclick="expWord()" class="flex-1 py-1.5 bg-blue-700 hover:bg-blue-600 text-white rounded text-xs" title="Export Word">📝</button>
          <button onclick="toggleSB()" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">◀</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <header class="bg-slate-900/90 border-b border-slate-700 px-5 py-3 flex items-center justify-between shrink-0">
        <div>
          <h2 class="text-lg font-bold text-white" id="pageTitle">Atelier 1</h2>
          <p class="text-slate-400 text-xs" id="pageDesc">Cadrage</p>
        </div>
        <div class="flex items-center gap-2">
          <span id="saveInd" class="text-green-400 text-xs flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-green-400 rounded-full"></span>Sauvé </span>
          <button onclick="showSettings()" class="p-1.5 hover:bg-slate-800 rounded text-slate-400">⚙️</button>
        </div>
      </header>
      <div class="flex-1 p-5 overflow-y-auto" id="main"></div>
    </main>

    <!-- Modals -->
    <div id="startModal" class="modal active">
      <div class="bg-slate-800 rounded-2xl p-6 max-w-md w-full border border-slate-600">
        <div class="text-center mb-5">
          <div class="w-20 h-20 bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-3">🛡️</div>
          <h2 class="text-xl font-bold text-white">EBIOS RM Pro v5</h2>
          <p class="text-slate-400 text-sm mt-1">Analyse de Risques • ANSSI • MITRE ATT&CK</p>
        </div>
        <div id="savedBox" class="hidden mb-4 p-3 bg-blue-500/20 border border-blue-500/50 rounded-lg">
          <p class="text-blue-300 text-sm font-medium">📁 Analyse détectée</p>
          <p class="text-slate-400 text-xs mt-0.5" id="savedInfo"></p>
        </div>
        <div class="space-y-2">
          <button onclick="loadSaved()" id="btnResume" class="hidden w-full py-2.5 btn btn-blue">📂 Reprendre</button>
          <button onclick="startNew()" class="w-full py-2.5 btn btn-green">✨ Nouvelle analyse</button>
          <button onclick="document.getElementById('fileIn').click()" class="w-full py-2.5 btn btn-gray">📥 Importer JSON</button>
        </div>
        <input type="file" id="fileIn" accept=".json" class="hidden" onchange="impJSON(event)">
      </div>
    </div>
    <div id="editModal" class="modal">
      <div class="bg-slate-800 rounded-xl p-5 max-w-lg w-full border border-slate-600 max-h-[85vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-white" id="editTitle">Modifier</h3>
          <button onclick="closeEdit()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <div id="editBody"></div>
        <div class="flex gap-2 mt-4">
          <button onclick="saveEdit()" class="flex-1 btn btn-blue">Enregistrer</button>
          <button onclick="closeEdit()" class="flex-1 btn btn-gray">Annuler</button>
        </div>
      </div>
    </div>
    <div id="mitreModal" class="modal">
      <div class="bg-slate-800 rounded-xl p-5 max-w-5xl w-full border border-slate-600 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg font-bold text-white">⚔️ MITRE ATT&CK</h3>
          <button onclick="closeMitre()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <input type="text" id="mitreQ" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm mb-3" placeholder="Rechercher..." oninput="filterMitre()">
        <div id="mitreGrid" class="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2"></div>
      </div>
    </div>
    <div id="bdcModal" class="modal">
      <div class="bg-slate-800 rounded-xl p-5 max-w-5xl w-full border border-slate-600 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg font-bold text-white">📚 Base ANSSI</h3>
          <button onclick="closeBDC()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <div id="bdcBody"></div>
      </div>
    </div>
    <div id="settingsModal" class="modal">
      <div class="bg-slate-800 rounded-xl p-5 max-w-sm w-full border border-slate-600">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-white">⚙️ Paramètres</h3>
          <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="text-slate-400 text-xs">Nom du projet</label>
            <input type="text" id="setName" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white mt-1" onchange="D.meta.studyName=this.value;save();updUI()">
          </div>
          <div>
            <label class="text-slate-400 text-xs">Organisation</label>
            <input type="text" id="setOrg" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white mt-1" onchange="D.meta.organization=this.value;save()">
          </div>
          <div>
            <label class="text-slate-400 text-xs">Jalons PACS</label>
            <select id="setJal" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white mt-1" onchange="D.meta.jalons=+this.value;save()">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
            </select>
          </div>
          <button onclick="if(confirm('Tout effacer?')){localStorage.clear();location.reload()}" class="w-full mt-3 py-2 bg-red-600/20 text-red-400 rounded-lg text-sm">🗑️ Réinitialiser</button>
        </div>
      </div>
    </div>

    <script src="./EBIOS-RM-Pro-v5.js"></script>
  </body>
</html>
